<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advocate Sitaram Pakhne | Premium Legal Services</title>
    
    <!-- Tailwind CSS for Styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FontAwesome for Premium Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- React & ReactDOM (Loads React directly in the browser) -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <!-- Babel (Translates the code so browsers can read it) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap');
        
        .font-serif { font-family: 'Playfair Display', serif; }
        .font-sans { font-family: 'Inter', sans-serif; }
        
        html { scroll-behavior: smooth; }
        body { -webkit-tap-highlight-color: transparent; }

        /* Custom Cinematic Animations */
        @keyframes kenburns {
          0% { transform: scale(1); }
          100% { transform: scale(1.1); }
        }
        .animate-kenburns {
          animation: kenburns 25s ease-out infinite alternate;
        }

        @keyframes float {
          0% { transform: translateY(0px); }
          50% { transform: translateY(-10px); }
          100% { transform: translateY(0px); }
        }
        .animate-float {
          animation: float 6s ease-in-out infinite;
        }

        /* Diagonal lines pattern for CTA */
        .pattern-diagonal-lines {
          background-image: repeating-linear-gradient(
            45deg,
            #000 0,
            #000 1px,
            transparent 0,
            transparent 50%
          );
          background-size: 10px 10px;
        }
    </style>
</head>
<body class="font-sans antialiased text-gray-900 bg-white selection:bg-[#c5a059] selection:text-[#0a1128] overflow-x-hidden">
    
    <!-- Website will be rendered inside this div -->
    <div id="root"></div>

    <!-- The actual React Code -->
    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- Custom Hooks ---
        const useScrollReveal = (options = {}) => {
          const [isVisible, setIsVisible] = useState(false);
          const ref = useRef(null);

          useEffect(() => {
            const observer = new IntersectionObserver(
              ([entry]) => {
                if (entry.isIntersecting) {
                  setIsVisible(true);
                  observer.unobserve(entry.target);
                }
              },
              { threshold: 0.1, rootMargin: '0px 0px -50px 0px', ...options }
            );

            if (ref.current) {
              observer.observe(ref.current);
            }

            return () => {
              if (ref.current) {
                observer.unobserve(ref.current);
              }
            };
          }, []);

          return [ref, isVisible];
        };

        // --- Components ---
        const RevealWrapper = ({ children, delay = 0, direction = 'up', className = "" }) => {
          const [ref, isVisible] = useScrollReveal();
          
          const getTranslate = () => {
            if (direction === 'up') return 'translate-y-12';
            if (direction === 'down') return '-translate-y-12';
            if (direction === 'left') return 'translate-x-12';
            if (direction === 'right') return '-translate-x-12';
            return 'translate-y-12';
          };

          return (
            <div
              ref={ref}
              className={`transition-all duration-1000 ease-out ${
                isVisible ? 'opacity-100 translate-y-0 translate-x-0' : `opacity-0 ${getTranslate()}`
              } ${className}`}
              style={{ transitionDelay: `${delay}ms` }}
            >
              {children}
            </div>
          );
        };

        const Navbar = () => {
          const [isScrolled, setIsScrolled] = useState(false);
          const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false);

          useEffect(() => {
            const handleScroll = () => {
              setIsScrolled(window.scrollY > 50);
            };
            window.addEventListener('scroll', handleScroll);
            return () => window.removeEventListener('scroll', handleScroll);
          }, []);

          useEffect(() => {
            if (isMobileMenuOpen) {
              document.body.style.overflow = 'hidden';
            } else {
              document.body.style.overflow = 'unset';
            }
          }, [isMobileMenuOpen]);

          const navLinks = [
            { name: 'About', href: '#about' },
            { name: 'Practice Areas', href: '#practice-areas' },
            { name: 'Why Us', href: '#why-us' },
            { name: 'Testimonials', href: '#testimonials' },
          ];

          return (
            <>
              <nav className={`fixed w-full z-50 transition-all duration-500 ${
                isScrolled ? 'bg-[#0a1128]/95 backdrop-blur-xl py-3 md:py-4 shadow-2xl' : 'bg-transparent py-5 md:py-6'
              }`}>
                <div className="max-w-7xl mx-auto px-5 md:px-12 flex justify-between items-center">
                  <a href="#" className="flex items-center gap-2 md:gap-3 group relative z-50">
                    <i className="fa-solid fa-scale-balanced text-[#c5a059] text-2xl md:text-3xl transition-transform group-hover:scale-110 duration-500"></i>
                    <div className="flex flex-col">
                      <span className={`font-serif text-lg md:text-xl tracking-wider leading-none transition-colors duration-300 ${isMobileMenuOpen ? 'text-white' : 'text-white'}`}>
                        PAKHNE LEGAL
                      </span>
                      <span className={`text-[0.55rem] md:text-[0.65rem] tracking-[0.2em] uppercase mt-1 transition-colors duration-300 ${isMobileMenuOpen ? 'text-gray-400' : (isScrolled ? 'text-gray-400' : 'text-gray-300')}`}>
                        Senior Advocate
                      </span>
                    </div>
                  </a>

                  <div className="hidden md:flex items-center gap-10">
                    <ul className="flex space-x-8">
                      {navLinks.map((link) => (
                        <li key={link.name}>
                          <a 
                            href={link.href} 
                            className={`text-sm tracking-wide transition-all hover:text-[#c5a059] relative after:absolute after:-bottom-1 after:left-0 after:w-0 after:h-[1px] after:bg-[#c5a059] hover:after:w-full after:transition-all after:duration-300 ${
                              isScrolled ? 'text-gray-300' : 'text-gray-200'
                            }`}
                          >
                            {link.name}
                          </a>
                        </li>
                      ))}
                    </ul>
                    <a 
                      href="#contact" 
                      className="group relative px-6 py-2.5 border border-[#c5a059] overflow-hidden transition-all duration-300"
                    >
                      <div className="absolute inset-0 bg-[#c5a059] translate-y-full group-hover:translate-y-0 transition-transform duration-300 ease-in-out"></div>
                      <span className="relative z-10 text-[#c5a059] group-hover:text-[#0a1128] text-sm tracking-wider uppercase transition-colors duration-300 font-medium">
                        Consult Now
                      </span>
                    </a>
                  </div>

                  <button 
                    className="md:hidden relative z-50 text-white p-2 focus:outline-none"
                    onClick={() => setIsMobileMenuOpen(!isMobileMenuOpen)}
                    aria-label="Toggle Menu"
                  >
                    {isMobileMenuOpen ? <i className="fa-solid fa-xmark text-2xl text-[#c5a059]"></i> : <i className="fa-solid fa-bars text-2xl"></i>}
                  </button>
                </div>
              </nav>

              <div className={`fixed inset-0 z-40 bg-[#0a1128] backdrop-blur-2xl transition-all duration-700 ease-[cubic-bezier(0.87,0,0.13,1)] flex flex-col justify-center px-6 ${
                isMobileMenuOpen ? 'opacity-100 translate-y-0' : 'opacity-0 -translate-y-full pointer-events-none'
              }`}>
                <div className="absolute top-0 right-0 w-64 h-64 bg-[#c5a059]/10 rounded-full blur-[80px] pointer-events-none"></div>
                <div className="absolute bottom-0 left-0 w-64 h-64 bg-[#c5a059]/5 rounded-full blur-[80px] pointer-events-none"></div>

                <ul className="flex flex-col space-y-6 relative z-10">
                  {navLinks.map((link, index) => (
                    <li 
                      key={link.name} 
                      className={`transform transition-all duration-500 ${isMobileMenuOpen ? 'translate-y-0 opacity-100' : 'translate-y-8 opacity-0'}`}
                      style={{ transitionDelay: `${200 + (index * 100)}ms` }}
                    >
                      <a 
                        href={link.href} 
                        onClick={() => setIsMobileMenuOpen(false)}
                        className="inline-block text-white font-serif text-4xl hover:text-[#c5a059] transition-colors"
                      >
                        {link.name}
                      </a>
                    </li>
                  ))}
                  <li 
                    className={`pt-8 transform transition-all duration-500 ${isMobileMenuOpen ? 'translate-y-0 opacity-100' : 'translate-y-8 opacity-0'}`}
                    style={{ transitionDelay: `${200 + (navLinks.length * 100)}ms` }}
                  >
                     <a 
                      href="#contact" 
                      onClick={() => setIsMobileMenuOpen(false)}
                      className="flex items-center justify-between w-full p-4 border border-[#c5a059]/30 bg-[#c5a059]/5 text-[#c5a059] uppercase tracking-wider text-sm active:bg-[#c5a059] active:text-[#0a1128] transition-colors"
                    >
                      <span>Book Consultation</span>
                      <i className="fa-solid fa-arrow-up-right-from-square text-sm"></i>
                    </a>
                  </li>
                </ul>
                
                <div className={`absolute bottom-10 left-6 right-6 border-t border-white/10 pt-6 transform transition-all duration-700 ${isMobileMenuOpen ? 'translate-y-0 opacity-100' : 'translate-y-8 opacity-0'}`} style={{ transitionDelay: '700ms' }}>
                  <p className="text-gray-400 text-xs tracking-widest uppercase mb-2">Direct Line</p>
                  <a href="tel:+919876543210" className="text-white font-serif text-xl">+91 98765 43210</a>
                </div>
              </div>
            </>
          );
        };

        const Hero = () => {
          return (
            <section className="relative h-[100dvh] flex items-center justify-center overflow-hidden">
              <div 
                className="absolute inset-0 z-0 bg-cover bg-center bg-no-repeat animate-kenburns"
                style={{ 
                  backgroundImage: 'url("https://images.unsplash.com/photo-1589994965851-a8f479c573a9?q=80&w=2000&auto=format&fit=crop")',
                  backgroundPosition: 'center 30%',
                  transformOrigin: 'center center'
                }}
              />
              <div className="absolute inset-0 z-10 bg-gradient-to-b from-[#0a1128]/80 via-[#0a1128]/70 to-[#0a1128]/95"></div>
              
              <div className="relative z-20 max-w-7xl mx-auto px-5 md:px-12 w-full text-left pt-20">
                <RevealWrapper delay={100} direction="up">
                  <div className="inline-flex items-center gap-3 mb-4 md:mb-6">
                    <span className="w-8 md:w-12 h-[1px] bg-[#c5a059]"></span>
                    <span className="text-[#c5a059] tracking-[0.2em] uppercase text-xs md:text-sm font-medium">Supreme Court & High Court</span>
                  </div>
                </RevealWrapper>
                
                <RevealWrapper delay={300} direction="up">
                  <h1 className="font-serif text-4xl sm:text-5xl md:text-7xl lg:text-8xl text-white leading-tight md:leading-[1.2] mb-6 md:mb-8 max-w-5xl">
                    Justice Built On <br className="hidden sm:block" />
                    <span className="text-transparent bg-clip-text bg-gradient-to-r from-[#c5a059] to-[#ebd197]">Experience, Integrity</span> <br className="hidden sm:block" />
                    & Trust.
                  </h1>
                </RevealWrapper>

                <RevealWrapper delay={500} direction="up">
                  <p className="text-gray-300 text-base md:text-lg lg:text-xl max-w-2xl mb-10 md:mb-12 font-light leading-relaxed">
                    Professional legal representation and strategic solutions tailored for individuals, businesses, and institutions by Adv. Sitaram Pakhne.
                  </p>
                </RevealWrapper>

                <RevealWrapper delay={700} direction="up" className="flex flex-col sm:flex-row gap-4 md:gap-6">
                  <a href="#contact" className="group relative px-6 md:px-8 py-4 bg-[#c5a059] text-[#0a1128] overflow-hidden text-center">
                    <span className="relative z-10 font-semibold tracking-wider uppercase text-xs md:text-sm flex items-center justify-center gap-2">
                      Book Consultation <i className="fa-solid fa-chevron-right text-sm group-hover:translate-x-1 transition-transform"></i>
                    </span>
                    <div className="absolute inset-0 bg-white/20 translate-y-full group-hover:translate-y-0 transition-transform duration-300 ease-in-out"></div>
                  </a>
                  <a href="tel:+919876543210" className="px-6 md:px-8 py-4 border border-white/30 text-white font-medium tracking-wider uppercase text-xs md:text-sm hover:bg-white/10 hover:border-white active:bg-white/20 transition-all duration-300 text-center">
                    Call +91 98765 43210
                  </a>
                </RevealWrapper>
              </div>

              <div className="absolute bottom-8 left-1/2 -translate-x-1/2 z-20 animate-bounce hidden sm:block">
                <div className="w-[1px] h-12 md:h-16 bg-gradient-to-b from-[#c5a059] to-transparent"></div>
              </div>
            </section>
          );
        };

        const About = () => {
          return (
            <section id="about" className="py-20 md:py-32 bg-white relative overflow-hidden">
              <div className="max-w-7xl mx-auto px-5 md:px-12">
                <div className="grid lg:grid-cols-2 gap-12 lg:gap-24 items-center">
                  
                  <RevealWrapper direction="right">
                    <div className="relative group px-4 sm:px-0">
                      <div className="absolute inset-0 bg-[#c5a059] translate-x-3 translate-y-3 sm:translate-x-6 sm:translate-y-6 md:translate-x-8 md:translate-y-8 transition-transform duration-700 ease-out group-hover:translate-x-4 group-hover:translate-y-4"></div>
                      <div className="relative z-10 overflow-hidden bg-gray-100">
                        <img 
                          src="https://images.unsplash.com/photo-1556157382-97eda2d62296?q=80&w=1000&auto=format&fit=crop" 
                          alt="Advocate Sitaram Pakhne" 
                          className="w-full h-[400px] sm:h-[500px] md:h-[600px] object-cover grayscale-[20%] sepia-[10%] contrast-125 transform group-hover:scale-105 transition-transform duration-1000"
                        />
                      </div>
                      <div className="absolute -bottom-6 -left-2 sm:-left-6 md:-left-12 z-20 bg-[#0a1128] p-5 sm:p-6 md:p-8 text-white shadow-2xl border-l-4 border-[#c5a059] animate-float">
                        <div className="font-serif text-4xl sm:text-5xl md:text-6xl text-[#c5a059] mb-1 md:mb-2">15+</div>
                        <div className="text-xs sm:text-sm tracking-widest uppercase font-light text-gray-300">Years of<br/>Legal Excellence</div>
                      </div>
                    </div>
                  </RevealWrapper>

                  <div className="mt-8 sm:mt-0">
                    <RevealWrapper delay={200} direction="left">
                      <div className="inline-flex items-center gap-3 mb-4">
                        <span className="text-[#c5a059] tracking-[0.2em] uppercase text-xs md:text-sm font-semibold">The Advocate</span>
                        <span className="w-8 md:w-12 h-[1px] bg-[#c5a059]"></span>
                      </div>
                      <h2 className="font-serif text-3xl sm:text-4xl md:text-5xl text-[#0a1128] mb-6 md:mb-8 leading-tight">
                        Advocate Sitaram Pakhne
                      </h2>
                    </RevealWrapper>
                    
                    <RevealWrapper delay={400} direction="left">
                      <div className="space-y-4 md:space-y-6 text-gray-600 font-light leading-relaxed text-base md:text-lg">
                        <p>
                          With over a decade and a half of dedicated practice, Adv. Sitaram Pakhne has established a reputation for uncompromising legal excellence, strategic brilliance, and steadfast dedication to client success.
                        </p>
                        <p>
                          Based in Pune, Pakhne Legal Associates handles complex litigation across civil, criminal, and corporate domains. We believe in a proactive approach, identifying potential legal hurdles before they manifest, and aggressively defending our clients' rights in the courtroom.
                        </p>
                        <p>
                          Our philosophy is simple: Ethical practice, transparent communication, and relentless pursuit of justice.
                        </p>
                      </div>
                    </RevealWrapper>

                    <RevealWrapper delay={600} direction="left" className="mt-8 md:mt-12 flex items-center gap-4 md:gap-6">
                      <img src="https://upload.wikimedia.org/wikipedia/commons/4/4b/Signature_placeholder.svg" alt="Signature" className="h-10 md:h-12 opacity-60" />
                      <div className="h-10 md:h-12 w-[1px] bg-gray-300"></div>
                      <div>
                        <p className="font-serif text-[#0a1128] text-lg md:text-xl">S. Pakhne</p>
                        <p className="text-xs md:text-sm text-[#c5a059] tracking-wider uppercase">Founder & Senior Counsel</p>
                      </div>
                    </RevealWrapper>
                  </div>

                </div>
              </div>
            </section>
          );
        };

        const PracticeAreas = () => {
          const areas = [
            { title: "Criminal Law", icon: <i className="fa-solid fa-shield-halved text-3xl md:text-4xl"></i>, desc: "Robust defense strategies and representation in complex criminal matters." },
            { title: "Civil Litigation", icon: <i className="fa-solid fa-scale-balanced text-3xl md:text-4xl"></i>, desc: "Resolving disputes involving contracts, property, and civil rights." },
            { title: "Corporate Law", icon: <i className="fa-regular fa-building text-3xl md:text-4xl"></i>, desc: "Strategic counsel for businesses, mergers, compliance, and governance." },
            { title: "Property Disputes", icon: <i className="fa-solid fa-house text-3xl md:text-4xl"></i>, desc: "Expert handling of real estate, inheritance, and land dispute cases." },
            { title: "Family Law", icon: <i className="fa-solid fa-users text-3xl md:text-4xl"></i>, desc: "Compassionate legal support for matrimonial, custody, and family disputes." },
            { title: "Consumer Matters", icon: <i className="fa-solid fa-briefcase text-3xl md:text-4xl"></i>, desc: "Protecting consumer rights and pursuing claims against unfair practices." },
            { title: "Arbitration", icon: <i className="fa-solid fa-gavel text-3xl md:text-4xl"></i>, desc: "Alternative dispute resolution focusing on efficient, out-of-court settlements." },
            { title: "Documentation", icon: <i className="fa-solid fa-file-contract text-3xl md:text-4xl"></i>, desc: "Precise drafting of contracts, deeds, wills, and corporate agreements." },
          ];

          return (
            <section id="practice-areas" className="py-20 md:py-32 bg-[#f8f9fa] relative">
              <div className="absolute top-0 left-0 w-full h-px bg-gradient-to-r from-transparent via-gray-200 to-transparent"></div>
              
              <div className="max-w-7xl mx-auto px-5 md:px-12">
                <RevealWrapper className="text-center max-w-3xl mx-auto mb-16 md:mb-20">
                  <div className="inline-flex items-center justify-center gap-3 mb-4">
                    <span className="w-6 md:w-8 h-[1px] bg-[#c5a059]"></span>
                    <span className="text-[#c5a059] tracking-[0.2em] uppercase text-xs md:text-sm font-semibold">Areas of Expertise</span>
                    <span className="w-6 md:w-8 h-[1px] bg-[#c5a059]"></span>
                  </div>
                  <h2 className="font-serif text-3xl sm:text-4xl md:text-5xl text-[#0a1128] mb-4 md:mb-6">Comprehensive Legal Solutions</h2>
                  <p className="text-gray-600 font-light text-base md:text-lg px-4">Delivering specialized legal knowledge across diverse practice areas to protect your interests.</p>
                </RevealWrapper>

                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 md:gap-6 lg:gap-8">
                  {areas.map((area, index) => (
                    <RevealWrapper key={index} delay={(index % 4) * 100} direction="up">
                      <div className="group bg-white p-8 md:p-10 h-full border border-gray-100 hover:border-[#c5a059]/30 active:border-[#c5a059] transition-all duration-500 hover:shadow-2xl hover:-translate-y-2 active:scale-[0.98] relative overflow-hidden cursor-pointer flex flex-col justify-between">
                        <div className="absolute top-0 left-0 w-full h-1 bg-[#c5a059] transform origin-left scale-x-0 group-hover:scale-x-100 transition-transform duration-500 ease-out"></div>
                        
                        <div>
                          <div className="text-[#0a1128] mb-5 md:mb-6 group-hover:text-[#c5a059] transition-colors duration-300">
                            {area.icon}
                          </div>
                          <h3 className="font-serif text-xl md:text-2xl text-[#0a1128] mb-3 md:mb-4 group-hover:text-[#c5a059] transition-colors duration-300">{area.title}</h3>
                          <p className="text-gray-600 font-light leading-relaxed text-sm">{area.desc}</p>
                        </div>
                        
                        <div className="mt-6 md:mt-8 flex items-center text-xs md:text-sm font-semibold text-[#0a1128] group-hover:text-[#c5a059] transition-colors uppercase tracking-wider">
                          Learn More <i className="fa-solid fa-chevron-right text-sm ml-2 transform group-hover:translate-x-2 transition-transform"></i>
                        </div>
                      </div>
                    </RevealWrapper>
                  ))}
                </div>
              </div>
            </section>
          );
        };

        const WhyChooseUs = () => {
          const stats = [
            { icon: <i className="fa-solid fa-award text-3xl md:text-4xl"></i>, count: "15+", label: "Years Exp." },
            { icon: <i className="fa-solid fa-book-open text-3xl md:text-4xl"></i>, count: "1.2k+", label: "Cases Won" },
            { icon: <i className="fa-solid fa-users text-3xl md:text-4xl"></i>, count: "98%", label: "Satisfaction" },
            { icon: <i className="fa-solid fa-shield text-3xl md:text-4xl"></i>, count: "100%", label: "Confidential" },
          ];

          return (
            <section id="why-us" className="py-20 md:py-32 bg-[#0a1128] text-white relative overflow-hidden">
              <div className="absolute top-0 right-0 w-full md:w-1/2 h-full bg-[#c5a059]/5 blur-[100px] md:blur-[150px] rounded-full pointer-events-none"></div>
              
              <div className="max-w-7xl mx-auto px-5 md:px-12 relative z-10">
                <div className="grid lg:grid-cols-2 gap-12 lg:gap-24 items-center">
                  <div>
                    <RevealWrapper>
                      <div className="inline-flex items-center gap-3 mb-4">
                        <span className="text-[#c5a059] tracking-[0.2em] uppercase text-xs md:text-sm font-semibold">The Pakhne Advantage</span>
                        <span className="w-8 md:w-12 h-[1px] bg-[#c5a059]"></span>
                      </div>
                      <h2 className="font-serif text-3xl sm:text-4xl md:text-5xl mb-6 md:mb-8 leading-tight">
                        Strategic Thinking.<br/>Relentless Execution.
                      </h2>
                    </RevealWrapper>
                    
                    <RevealWrapper delay={200}>
                      <p className="text-gray-400 font-light text-base md:text-lg mb-8 md:mb-10 leading-relaxed">
                        We don't just process cases; we engineer legal victories. Our approach is rooted in deep analytical research, aggressive courtroom strategy, and an unwavering commitment to professional ethics.
                      </p>
                    </RevealWrapper>

                    <div className="space-y-4 md:space-y-6">
                      {[
                        "Highly personalized legal strategies",
                        "Transparent communication and billing",
                        "Extensive courtroom experience",
                        "Strict adherence to client confidentiality"
                      ].map((item, idx) => (
                        <RevealWrapper key={idx} delay={300 + (idx * 100)} className="flex items-start gap-3 md:gap-4">
                          <div className="mt-0.5 md:mt-1 bg-[#c5a059]/20 p-1 md:p-1.5 rounded-full shrink-0 flex items-center justify-center w-6 h-6 md:w-7 md:h-7">
                            <i className="fa-solid fa-shield text-[#c5a059] text-xs md:text-sm"></i>
                          </div>
                          <p className="text-gray-300 text-sm md:text-base">{item}</p>
                        </RevealWrapper>
                      ))}
                    </div>
                  </div>

                  <div className="grid grid-cols-2 gap-4 md:gap-6 mt-8 lg:mt-0">
                    {stats.map((stat, idx) => (
                      <RevealWrapper key={idx} delay={400 + (idx * 100)} direction={idx % 2 === 0 ? 'right' : 'left'}>
                        <div className="bg-white/5 border border-white/10 p-6 md:p-8 backdrop-blur-sm hover:bg-white/10 transition-colors duration-300 flex flex-col items-center sm:items-start text-center sm:text-left">

                          <div className="font-serif text-3xl sm:text-4xl md:text-5xl text-white mb-1 md:mb-2">{stat.count}</div>
                          <div className="text-[0.65rem] md:text-xs uppercase tracking-widest text-gray-400">{stat.label}</div>

                      </RevealWrapper>
                    ))}

              </div>

        };

        const Testimonials = () => {
          const testimonials = [
            { text: "Advocate Pakhne's strategic approach saved our company from a devastating corporate dispute. His intellect and courtroom presence are unmatched.", author: "Rajesh D.", title: "CEO, Tech Solutions Pune" },
            { text: "During a highly stressful property litigation, the team at Pakhne Legal provided not just legal expertise, but calm assurance and ultimate victory.", author: "Meera S.", title: "Private Client" },
            { text: "Integrity, transparency, and results. They handled my complex civil matter with the utmost professionalism. Highly recommended for serious legal issues.", author: "Vikram M.", title: "Real Estate Developer" },
          ];

          return (
            <section id="testimonials" className="py-20 md:py-32 bg-[#f8f9fa]">
              <div className="max-w-7xl mx-auto px-5 md:px-12">
                <RevealWrapper className="text-center max-w-3xl mx-auto mb-16 md:mb-20">
                  <div className="inline-flex items-center justify-center gap-3 mb-4">
                    <span className="w-6 md:w-8 h-[1px] bg-[#c5a059]"></span>
                    <span className="text-[#c5a059] tracking-[0.2em] uppercase text-xs md:text-sm font-semibold">Client Trust</span>
                    <span className="w-6 md:w-8 h-[1px] bg-[#c5a059]"></span>
                  </div>
                  <h2 className="font-serif text-3xl sm:text-4xl md:text-5xl text-[#0a1128] mb-6">Words from our Clients</h2>

                <div className="grid md:grid-cols-3 gap-6 md:gap-8">

                        <div className="text-[#c5a059] font-serif text-6xl md:text-7xl absolute top-4 left-4 md:top-6 md:left-6 opacity-10 leading-none">"</div>
                        <p className="text-gray-600 italic mb-8 relative z-10 pt-4 leading-relaxed text-sm md:text-base">
                          "{t.text}"
                        </p>
                        <div className="flex items-center gap-4 border-t border-gray-100 pt-6">
                          <div className="w-10 h-10 md:w-12 md:h-12 bg-[#0a1128] rounded-full flex items-center justify-center text-[#c5a059] font-serif text-lg md:text-xl shrink-0">
                            {t.author.charAt(0)}
                          </div>
                          <div>
                            <h4 className="font-serif text-[#0a1128] font-semibold text-sm md:text-base">{t.author}</h4>
                            <p className="text-[0.65rem] md:text-xs text-gray-500 uppercase tracking-wider">{t.title}</p>

        const CTA = () => {

                  <p className="text-[#0a1128]/80 text-base md:text-xl mb-8 md:mb-10 max-w-2xl mx-auto font-medium">
                    Schedule a confidential consultation today. Protect your rights with expert representation.
                  </p>
                  <div className="flex flex-col sm:flex-row justify-center gap-4 md:gap-6">
                    <a href="tel:+919876543210" className="px-6 md:px-8 py-4 bg-[#0a1128] text-white font-semibold tracking-wider uppercase text-xs md:text-sm hover:bg-[#1a264a] active:scale-95 transition-all shadow-xl flex items-center justify-center gap-3 rounded-sm">
                      <i className="fa-solid fa-phone"></i> Call Now
                    </a>
                    <a href="https://wa.me/919876543210" target="_blank" rel="noreferrer" className="px-6 md:px-8 py-4 bg-white/20 backdrop-blur-sm border-2 border-[#0a1128] text-[#0a1128] font-semibold tracking-wider uppercase text-xs md:text-sm hover:bg-[#0a1128] hover:text-white active:scale-95 transition-all shadow-xl flex items-center justify-center gap-3 rounded-sm">
                      <i className="fa-brands fa-whatsapp text-lg"></i> WhatsApp Us
                    </a>
                  </div>
                </RevealWrapper>
              </div>
            </section>
          );
        };

        const Contact = () => {
          const [formStatus, setFormStatus] = useState('');

                <div className="grid lg:grid-cols-2 gap-12 lg:gap-24">

                    <RevealWrapper>

                      </div>
                      <h2 className="font-serif text-3xl sm:text-4xl md:text-5xl text-[#0a1128] mb-6 md:mb-8">Request a Consultation</h2>
                      <p className="text-gray-600 mb-8 md:mb-12 text-sm md:text-base">Fill out the form below with details of your legal inquiry, and our office will get back to you promptly to schedule a meeting.</p>

                    <RevealWrapper delay={200}>
                      <form onSubmit={handleSubmit} className="space-y-6 md:space-y-8">
                        <div className="grid md:grid-cols-2 gap-6">
                          <div className="relative">

                          </div>
                          <div className="relative mt-2 md:mt-0">
                            <input required type="tel" id="phone" className="peer w-full border-b-2 border-gray-200 py-3 bg-transparent text-gray-800 placeholder-transparent focus:outline-none focus:border-[#c5a059] transition-colors" placeholder="+91 XXXXX XXXXX" />

                          <select required id="matter" defaultValue="" className="peer w-full border-b-2 border-gray-200 py-3 bg-transparent text-gray-800 focus:outline-none focus:border-[#c5a059] transition-colors appearance-none cursor-pointer">

                            <option value="criminal">Criminal Defense</option>
                            <option value="civil">Civil Litigation</option>
                            <option value="corporate">Corporate Matter</option>
                            <option value="property">Property Dispute</option>
                            <option value="family">Family Law</option>
                            <option value="other">Other</option>

                            <i className="fa-solid fa-chevron-down text-sm"></i>
                          </div>
                        </div>
                        <div className="relative">
                          <textarea required id="message" rows="4" className="peer w-full border-b-2 border-gray-200 py-3 bg-transparent text-gray-800 placeholder-transparent focus:outline-none focus:border-[#c5a059] transition-colors resize-none" placeholder="Briefly describe your situation..."></textarea>
                          <label htmlFor="message" className="absolute left-0 -top-3.5 text-xs font-semibold uppercase tracking-widest text-gray-500 transition-all peer-placeholder-shown:text-sm peer-placeholder-shown:text-gray-400 peer-placeholder-shown:top-3.5 peer-focus:-top-3.5 peer-focus:text-xs peer-focus:text-[#c5a059]">Message</label>

                              : formStatus === 'success'
                                ? 'bg-green-600 text-white'
                                : 'bg-[#0a1128] text-white hover:bg-[#c5a059] active:scale-95'
                          }`}
                        >
                          {formStatus === 'sending' ? 'Sending...' : formStatus === 'success' ? 'Message Sent' : 'Submit Request'}

                        {formStatus === 'success' && (
                          <RevealWrapper direction="up">
                            <p className="text-sm mt-4 text-green-600 font-medium">
                              ✓ Thank you. Your message has been sent successfully. We will contact you shortly.
                            </p>
                          </RevealWrapper>
                        )}
                      </form>
                    </RevealWrapper>
                  </div>

                  <div className="order-1 lg:order-2 bg-[#f8f9fa] p-6 sm:p-10 md:p-14 border border-gray-100 rounded-sm">
                    <RevealWrapper delay={300} direction="left">
                      <h3 className="font-serif text-2xl sm:text-3xl text-[#0a1128] mb-8">Office Contact</h3>
                      
                      <div className="space-y-6 md:space-y-8">
                        <div className="flex items-start gap-4">
                          <div className="mt-1 text-[#c5a059] bg-white p-2 rounded-full shadow-sm w-10 h-10 flex items-center justify-center shrink-0">
                            <i className="fa-solid fa-location-dot text-lg md:text-xl"></i>
                          </div>
                          <div>
                            <h4 className="text-xs md:text-sm uppercase tracking-widest text-gray-500 mb-1 font-semibold">Address</h4>
                            <p className="text-[#0a1128] font-medium text-sm md:text-base">Pakhne Legal Associates,</p>
                            <p className="text-gray-600 text-sm md:text-base">3rd Floor, Prestige Chambers,<br/>FC Road, Shivajinagar,<br/>Pune, Maharashtra – 411005</p>
                          </div>
                        </div>
                        
                        <div className="flex items-start gap-4">
                          <div className="mt-1 text-[#c5a059] bg-white p-2 rounded-full shadow-sm w-10 h-10 flex items-center justify-center shrink-0">
                             <i className="fa-solid fa-phone text-lg md:text-xl"></i>
                          </div>
                          <div>
                            <h4 className="text-xs md:text-sm uppercase tracking-widest text-gray-500 mb-1 font-semibold">Phone</h4>
                            <a href="tel:+919876543210" className="text-[#0a1128] text-base md:text-lg font-serif hover:text-[#c5a059] transition-colors">+91 98765 43210</a>
                          </div>
                        </div>

                        <div className="flex items-start gap-4">
                          <div className="mt-1 text-[#c5a059] bg-white p-2 rounded-full shadow-sm w-10 h-10 flex items-center justify-center shrink-0">
                            <i className="fa-solid fa-envelope text-lg md:text-xl"></i>
                          </div>
                          <div>
                            <h4 className="text-xs md:text-sm uppercase tracking-widest text-gray-500 mb-1 font-semibold">Email</h4>
                            <a href="mailto:contact@sitarampakhnelegal.in" className="text-[#0a1128] text-sm md:text-base hover:text-[#c5a059] transition-colors break-all">contact@sitarampakhnelegal.in</a>
                          </div>
                        </div>

                        <div className="flex items-start gap-4">
                          <div className="mt-1 text-[#c5a059] bg-white p-2 rounded-full shadow-sm w-10 h-10 flex items-center justify-center shrink-0">
                            <i className="fa-solid fa-clock text-lg md:text-xl"></i>
                          </div>
                          <div>
                            <h4 className="text-xs md:text-sm uppercase tracking-widest text-gray-500 mb-1 font-semibold">Working Hours</h4>
                            <p className="text-gray-600 text-sm md:text-base">Mon - Fri: 10:00 AM - 7:00 PM<br/>Sat: 10:00 AM - 2:00 PM<br/>Sun: Closed</p>
                          </div>
                        </div>
                      </div>

                      <div className="mt-10 md:mt-12 w-full aspect-video md:h-48 bg-gray-200 relative overflow-hidden group border border-gray-300 rounded-sm">
                        <div className="absolute inset-0 bg-[#0a1128]/10 group-hover:bg-transparent transition-colors z-10 pointer-events-none"></div>
                        <iframe 
                          src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3783.197022136009!2d73.84078861489274!3d18.52002348740921!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3bc2c07ba06154b7%3A0x8e83315a6b0c679a!2sFergusson%20College%20Rd%2C%20Shivajinagar%2C%20Pune%2C%20Maharashtra!5e0!3m2!1sen!2sin!4v1650000000000!5m2!1sen!2sin" 
                          className="w-full h-full grayscale opacity-80 group-hover:grayscale-0 group-hover:opacity-100 transition-all duration-700"
                          style={{border:0}} 
                          allowFullScreen="" 
                          loading="lazy" 
                          referrerPolicy="no-referrer-when-downgrade"
                          title="Office Location"
                        ></iframe>
                      </div>
                    </RevealWrapper>
                  </div>

                </div>
              </div>
            </section>
          );
        };

        const Footer = () => {
          return (
            <footer className="bg-[#050814] text-white pt-16 md:pt-20 pb-8 md:pb-10 border-t border-white/10">
              <div className="max-w-7xl mx-auto px-5 md:px-12">
                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-10 md:gap-12 mb-12 md:mb-16">
                  
                  <div className="col-span-1 lg:col-span-1">
                    <div className="flex items-center gap-3 mb-6">
                      <i className="fa-solid fa-scale-balanced text-[#c5a059] text-2xl md:text-3xl"></i>
                      <div className="flex flex-col">
                        <span className="font-serif text-lg md:text-xl tracking-wider leading-none text-white">
                          PAKHNE LEGAL
                        </span>
                      </div>
                    </div>
                    <p className="text-gray-400 text-sm leading-relaxed mb-6">
                      Elite legal representation providing strategic solutions for individuals, businesses, and institutions across India.
                    </p>
                  </div>

                  <div>
                    <h4 className="text-xs md:text-sm font-semibold uppercase tracking-widest text-[#c5a059] mb-5 md:mb-6">Quick Links</h4>
                    <ul className="space-y-3">
                      {['Home', 'About Advocate', 'Practice Areas', 'Why Choose Us', 'Contact'].map((link) => (

                  <div>

                    <ul className="space-y-3">
                      {['Criminal Litigation', 'Civil Disputes', 'Corporate Law', 'Family Matters', 'Arbitration'].map((link) => (

                          <a href="#practice-areas" className="text-gray-400 hover:text-white transition-colors text-sm">{link}</a>

                  <div>

                      <a href="#" className="w-10 h-10 border border-white/20 flex items-center justify-center rounded-full hover:bg-[#c5a059] hover:border-[#c5a059] hover:text-[#0a1128] transition-all" aria-label="Facebook">

                      </a>
                      <a href="#" className="w-10 h-10 border border-white/20 flex items-center justify-center rounded-full hover:bg-[#c5a059] hover:border-[#c5a059] hover:text-[#0a1128] transition-all" aria-label="Twitter/X">
                        <i className="fa-brands fa-x-twitter text-sm"></i>
                      </a>
                    </div>
                  </div>

                </div>

                <div className="border-t border-white/10 pt-8 flex flex-col lg:flex-row justify-between items-center gap-6 text-xs text-gray-500 text-center lg:text-left">
                  <p>&copy; {new Date().getFullYear()} Pakhne Legal Associates. All Rights Reserved.</p>
                  <div className="max-w-2xl">
                    <p className="italic leading-relaxed">
                      Disclaimer: The rules of the Bar Council of India prohibit law firms from soliciting work or advertising. 
                      By accessing this website, you acknowledge that you are seeking information of your own accord.
                    </p>
                  </div>
                </div>
              </div>
            </footer>
          );

        const FloatingWhatsApp = () => {
          return (
            <div className="fixed bottom-6 right-6 z-50 flex items-center justify-end">
              <div className="absolute w-14 h-14 bg-[#25D366] rounded-full animate-ping opacity-20 pointer-events-none"></div>
              
              <a 
                href="https://wa.me/919876543210" 
                target="_blank" 
                rel="noreferrer"
                className="relative bg-[#25D366] text-white p-3.5 md:p-4 rounded-full shadow-2xl hover:scale-110 active:scale-95 transition-all duration-300 group flex items-center justify-center"

                </span>
              </a>
            </div>
          );
        };

        const App = () => {
          return (
            <>
              <Navbar />
              <main>
                <Hero />
                <About />
                <PracticeAreas />
                <WhyChooseUs />
                <Testimonials />
                <CTA />
                <Contact />
              </main>
              <Footer />
              <FloatingWhatsApp />
            </>
          );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
